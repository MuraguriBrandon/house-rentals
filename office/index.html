<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ea">
  <title>House Rentals | Agent Office</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #23332d;
      background: #f5f2ea;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --ink: #23332d;
      --muted: #78827a;
      --green: #2f7657;
      --line: #e7e1d4;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 34px 22px 48px;
      background:
        radial-gradient(ellipse at 12% 2%, rgba(233, 220, 187, .5), transparent 34rem),
        #f5f2ea;
    }

    .page { width: min(1120px, 100%); margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 15px;
      color: #fff;
      background: var(--green);
      box-shadow: 0 5px 12px rgba(47, 118, 87, .2);
      font-size: 22px;
    }

    .brand-name { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
    .brand-caption { margin: 3px 0 0; color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 99px;
      color: #52635a;
      background: rgba(255,255,255,.7);
      font-size: 12px;
      font-weight: 650;
    }

    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #4a9b70; box-shadow: 0 0 0 4px rgba(74,155,112,.12); }

    .intro { margin: 0 0 22px; }
    .eyebrow { margin: 0 0 8px; color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(29px, 4vw, 42px); letter-spacing: -.055em; line-height: 1.08; }
    .subtitle { margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }

    .office-shell {
      overflow: hidden;
      border: 1px solid #e3dccd;
      border-radius: 24px;
      background: #fffdf8;
      box-shadow: 0 20px 60px rgba(68, 61, 43, .1), 0 2px 6px rgba(68, 61, 43, .04);
    }

    .office-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 17px 22px;
      border-bottom: 1px solid var(--line);
      background: #fffefa;
    }

    .toolbar-title { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 750; }
    .toolbar-icon { font-size: 18px; }
    .team-count { color: var(--muted); font-size: 12px; }

    .room {
      position: relative;
      isolation: isolate;
      min-height: 390px;
      padding: 36px clamp(18px, 5vw, 58px) 40px;
      background-color: #e9e3d6;
      background-image:
        linear-gradient(rgba(255,255,255,.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.2) 1px, transparent 1px);
      background-size: 42px 42px;
    }

    .room::before {
      position: absolute;
      z-index: -1;
      top: 0;
      right: 0;
      left: 0;
      height: 13px;
      border-bottom: 4px solid #d5c9b2;
      background: #f8f5ed;
      content: "";
    }

    .window-row { display: flex; justify-content: center; gap: 12px; margin: 0 auto 34px; }
    .window {
      width: clamp(54px, 10vw, 102px);
      height: 22px;
      border: 4px solid #fffaf0;
      border-radius: 5px;
      background: linear-gradient(135deg, #c9e5e3, #e4f0e5 60%, #c3ddd7);
      box-shadow: 0 2px 4px rgba(81, 90, 75, .12);
    }

    #office {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px clamp(18px, 5vw, 58px);
      width: min(850px, 100%);
      margin: 0 auto;
    }

    .agent {
      position: relative;
      min-width: 0;
      padding: 0 6px 8px;
      text-align: center;
    }

    .agent-person {
      position: relative;
      z-index: 1;
      display: grid;
      width: 74px;
      height: 74px;
      margin: 0 auto -9px;
      place-items: center;
      border: 5px solid #f8f5ed;
      border-radius: 50%;
      background: var(--avatar-bg, #dce8dd);
      box-shadow: 0 5px 12px rgba(53, 65, 53, .13);
      font-size: 38px;
      transform-origin: 50% 85%;
    }

    .agent[data-status="working"] .agent-person { animation: busy-bob 1.2s ease-in-out infinite; }

    .desk {
      position: relative;
      min-height: 125px;
      padding: 17px 16px 14px;
      border: 1px solid rgba(115, 77, 43, .12);
      border-radius: 15px;
      background: linear-gradient(145deg, #c99461, #b77c4a);
      box-shadow: 0 8px 0 #9e663d, 0 13px 20px rgba(92, 63, 39, .14);
      text-align: left;
    }

    .desk::before, .desk::after {
      position: absolute;
      top: 50%;
      width: 8px;
      height: 30px;
      border-radius: 5px;
      background: #805638;
      content: "";
      transform: translateY(-10%);
    }

    .desk::before { left: 11px; }
    .desk::after { right: 11px; }

    .desk-surface {
      position: absolute;
      top: -8px;
      right: 9px;
      left: 9px;
      display: flex;
      height: 20px;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      border: 1px solid rgba(109, 72, 39, .13);
      border-radius: 9px;
      background: #d7a672;
    }

    .desk-surface span:first-child { width: 36px; height: 6px; border-radius: 4px; background: #6f8790; }
    .desk-surface span:last-child { width: 7px; height: 7px; border-radius: 50%; background: #e9d47e; }

    .agent-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 9px 0 7px; }
    .agent-name { overflow: hidden; color: #fffdf8; font-size: 15px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }

    .status {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border: 1px solid rgba(255,255,255,.52);
      border-radius: 99px;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .03em;
      text-transform: capitalize;
    }

    .status::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
    .status-idle { color: #fff; background: #77827a; }
    .status-working { color: #fff; background: #26734f; }
    .status-blocked { color: #fff; background: #a9483f; }
    .status-done { color: #fff; background: #416ca0; }
    .agent-task { display: -webkit-box; overflow: hidden; margin: 0; color: rgba(255,255,255,.94); font-size: 12px; line-height: 1.45; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }

    .agent-foot { display: flex; justify-content: space-between; gap: 8px; margin: 15px 3px 0; color: #68756c; font-size: 11px; }
    .agent-role { font-weight: 750; }
    .agent-updated { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .room-plant { position: absolute; z-index: -1; right: 20px; bottom: 18px; font-size: 35px; filter: drop-shadow(0 3px 1px rgba(64,73,53,.12)); }
    .room-plant.left { right: auto; left: 20px; }

    .office-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 21px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      background: #fffefa;
      font-size: 11px;
    }

    .refresh-label { display: flex; align-items: center; gap: 7px; }
    .refresh-icon { color: var(--green); font-size: 14px; }

    .notice {
      display: none;
      margin: 0 0 16px;
      padding: 12px 15px;
      border: 1px solid #e8c3bc;
      border-radius: 12px;
      color: #873e34;
      background: #fff1ed;
      font-size: 13px;
    }

    .notice.visible { display: block; }

    @keyframes busy-bob {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-5px) rotate(2deg); }
    }

    @media (max-width: 600px) {
      body { padding: 22px 14px 32px; }
      .topbar { margin-bottom: 22px; }
      .live-indicator { padding: 8px 10px; font-size: 11px; }
      .office-toolbar { align-items: flex-start; flex-direction: column; gap: 5px; padding: 14px 16px; }
      .room { min-height: 0; padding: 25px 14px 36px; }
      .window-row { margin-bottom: 26px; }
      #office { gap: 25px 12px; }
      .agent-person { width: 62px; height: 62px; font-size: 32px; }
      .desk { min-height: 133px; padding: 15px 11px 12px; }
      .agent-heading { align-items: flex-start; flex-direction: column; gap: 6px; }
      .agent-name { max-width: 100%; font-size: 13px; }
      .agent-foot { align-items: flex-start; flex-direction: column; gap: 3px; margin-top: 12px; }
      .room-plant { right: 6px; bottom: 5px; font-size: 26px; }
      .room-plant.left { right: auto; left: 6px; }
      .office-footer { align-items: flex-start; flex-direction: column; gap: 6px; padding: 12px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">⌂</div>
        <div>
          <p class="brand-name">HomeMate</p>
          <p class="brand-caption">Team workspace</p>
        </div>
      </div>
      <div class="live-indicator"><span class="live-dot" aria-hidden="true"></span>Live office</div>
    </header>

    <section class="intro" aria-labelledby="office-title">
      <p class="eyebrow">The people behind every home</p>
      <h1 id="office-title">Our agent office</h1>
      <p class="subtitle">A little look at the team keeping your rentals moving.</p>
    </section>

    <div id="notice" class="notice" role="status" aria-live="polite"></div>

    <section class="office-shell" aria-label="Agent office floor">
      <div class="office-toolbar">
        <div class="toolbar-title"><span class="toolbar-icon" aria-hidden="true">🏢</span> Main office <span aria-hidden="true">·</span> Team floor</div>
        <div id="team-count" class="team-count">Checking who's in today…</div>
      </div>
      <div class="room">
        <div class="window-row" aria-hidden="true"><span class="window"></span><span class="window"></span><span class="window"></span></div>
        <div id="office" aria-live="polite" aria-busy="true"></div>
        <span class="room-plant left" aria-hidden="true">🪴</span>
        <span class="room-plant" aria-hidden="true">🪴</span>
      </div>
      <div class="office-footer">
        <span>Agent activity is synced from the workspace status board.</span>
        <span class="refresh-label"><span class="refresh-icon" aria-hidden="true">↻</span><span id="last-refresh">Connecting…</span></span>
      </div>
    </section>
  </main>

  <script>
    const office = document.getElementById("office");
    const teamCount = document.getElementById("team-count");
    const notice = document.getElementById("notice");
    const lastRefresh = document.getElementById("last-refresh");
    const agentDesign = {
      manager: { emoji: "👩‍💼", color: "#e9ded0" },
      developer: { emoji: "🧑‍💻", color: "#d8e5ee" },
      tester: { emoji: "🧑‍🔬", color: "#e4e0f0" },
      "listings-writer": { emoji: "🧑‍🎨", color: "#f0dfd5" }
    };
    const validStatuses = new Set(["idle", "working", "blocked", "done"]);

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function renderAgent(agent) {
      const key = typeof agent.name === "string" ? agent.name : "";
      const design = agentDesign[key] || { emoji: "🙂", color: "#e0e5dc" };
      const status = validStatuses.has(agent.status) ? agent.status : "idle";
      const card = makeElement("article", "agent");
      card.dataset.status = status;

      const person = makeElement("div", "agent-person", design.emoji);
      person.style.setProperty("--avatar-bg", design.color);
      person.setAttribute("aria-hidden", "true");

      const desk = makeElement("div", "desk");
      const surface = makeElement("div", "desk-surface");
      surface.setAttribute("aria-hidden", "true");
      surface.append(makeElement("span"), makeElement("span"));

      const heading = makeElement("div", "agent-heading");
      heading.append(
        makeElement("span", "agent-name", typeof agent.role === "string" ? agent.role : "Team member"),
        makeElement("span", `status status-${status}`, status)
      );

      const taskText = typeof agent.task === "string" && agent.task.trim() ? agent.task : "No task assigned";
      const updatedText = typeof agent.updated === "string" && agent.updated.trim() ? agent.updated : "Not updated yet";
      desk.append(surface, heading, makeElement("p", "agent-task", `Task: ${taskText}`));

      const foot = makeElement("div", "agent-foot");
      foot.append(
        makeElement("span", "agent-role", key || "agent"),
        makeElement("span", "agent-updated", `Updated ${updatedText}`)
      );

      card.append(person, desk, foot);
      return card;
    }

    async function loadOffice() {
      try {
        const response = await fetch(`status.json?${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`Status board returned HTTP ${response.status}`);

        const data = await response.json();
        if (!data || !Array.isArray(data.agents)) throw new Error("Status board has an invalid format");

        const fragment = document.createDocumentFragment();
        data.agents.forEach(agent => fragment.append(renderAgent(agent || {})));
        office.replaceChildren(fragment);
        office.setAttribute("aria-busy", "false");
        teamCount.textContent = `${data.agents.length} ${data.agents.length === 1 ? "teammate" : "teammates"} on the floor`;
        lastRefresh.textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
        notice.classList.remove("visible");
        notice.textContent = "";
      } catch (error) {
        console.error("Could not load the agent office status:", error);
        notice.textContent = "Could not load agent activity. Check that the office server is running and try again.";
        notice.classList.add("visible");
        office.setAttribute("aria-busy", "false");
      }
    }

    loadOffice();
    window.setInterval(loadOffice, 2000);
  </script>
</body>
</html>
